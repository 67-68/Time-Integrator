# Insight Narrative Registry
# This file contains insight card narrative definitions

insight_narratives:
  # Universal narratives
  universal:
    praise:
      - "做的很棒！请保持！！！！！"
      - "go work!"

  # Specific narratives by action type
  specific:
    # Peak timespan narratives
    peak_timeSpan:
      presentation:
        card_success:
          title:
            - "深度专注新纪录！✨"
            - "你小子居然能专注这么久？"
        card_warning:
          title:
            - "数据观察：专注时长异常 🧐"
            - "数据异常！一级警报！"
      sementic_key:
        text:
          - "昨天，在所有行动中，你在“{action}”上专注了最多时间，达到了{timeSpan}分钟，时段为 {start} 至 {end}。"
        history_text: []
      judgement_key:
        praise: "universal.praise"
        doubt_accuracy:
          - "是不是标错了？"
        suggest_rest:
          - "休息会吧我怕你死了"
        prompt_work:
          - "啥玩意你昨天连一小时的专注都没有？太少了"
        ask_attribution:
          - "咋回事啊？找找自己的原因，是否烈性娱乐过多？"

    # Show ratio narratives
    show_ratio:
      presentation:
        card_info:
          title:
            - "时间分布展示"
      sementic_key:
        text:
          - "工作:{work.timeSpan}min, {work.ratio}% \n休息:{rest.timeSpan}min, {rest.ratio}% \n浪费:{waste.timeSpan}min, {waste.ratio}%"
      judgement_key:
        neutral_showinfo:
          - "test"

    # Post eat waste narratives
    post_eat_waste:
      presentation:
        card_warning:
          title:
            - "饭后摸鱼陷阱"
      sementic_key:
        text:
          - "昨天，你在“{data.meal.action}”({data.meal.start} - {data.meal.end})之后，立刻就开始“{data.waste.action}(到{data.waste.end})”，持续了{data.waste.timeSpan}分钟。"
        history_text:
          - "数据显示这已经不是第一次发生这种情况了。"
      judgement_key:
        warning:
          - "你浪费了很多时间哦～这些时间本可以用来睡觉，如今隔断了你的时间，让你更不容易睡着，污染了你的正反馈，即使是工作也不能专心。\n下次注意吧，喵。"

    # Unsettling heart narratives
    unsettling_heart:
      presentation:
        card_warning:
          title:
            - "躁动的心"
      sementic_key:
        text:
          - "昨天，你在“{data.meal.action}”({data.meal.start} - {data.meal.end})之后，\n 立刻就开始“{data.waste.action}(到{data.waste.end})”，持续了{data.waste.timeSpan}分钟。"
        history_text:
          - "数据显示这已经不是第一次发生这种情况了。"
      judgement_key:
        warning:
          - "尝试听会歌，运动一下吧。\n下次注意吧，喵。"

    # Post bash waste narratives
    post_bash_waste:
      presentation:
        card_warning:
          title:
            - "洗澡中解放的灵魂"
      sementic_key:
        text:
          - "昨天，你在洗澡之后浪费时间"
        history_text:
          - "数据显示这已经不是第一次发生这种情况了。"
      judgement_key:
        warning:
          - "尝试休息几分钟吧。\n下次注意吧，喵。"